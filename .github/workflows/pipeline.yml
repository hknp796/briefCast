# ─────────────────────────────────────────────
# BriefCast nightly pipeline.
#
# This replaces the always-on host for the batch half of the app: the pipeline
# is a ~10 minute job that runs once a night, which is exactly what a scheduled
# CI runner is for. No server to keep awake, no external cron, no cold start.
# The inbound Telegram bot lives separately, as a Supabase Edge Function
# (supabase/functions/telegram-bot).
#
# Cost: ~10 min/night ≈ 300 of the 2,000 free private-repo minutes per month
# (unlimited if the repo is public).
#
# NOTE: GitHub disables scheduled workflows on a repo with no commits for 60
# days, and emails the owner first. Any push re-arms it.
# ─────────────────────────────────────────────
name: Nightly pipeline

on:
  schedule:
    # 21:30 UTC = 3:00am IST. GitHub's scheduler is best-effort and can run
    # 5-30 min late under load — harmless here, briefs only need to exist by
    # ~6:30am IST.
    - cron: '30 21 * * *'
  workflow_dispatch:        # manual "Run workflow" button, for testing

# Never let a manual run overlap a scheduled one — stages 4/5 are idempotent
# per (user, date), but two concurrent runs would double-spend API quota.
concurrency:
  group: briefcast-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # well above the ~10 min real runtime; catches hangs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'      # <22 breaks @supabase/realtime-js (no native WebSocket)
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci --omit=dev
          pip install -r requirements.txt

      # No PYTHON_PATH here on purpose: fetchMarketData.js falls back to the
      # system `python3`, which is the one setup-python just put on PATH.
      - name: Run pipeline
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SERPER_API_KEY:      ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # A repo VARIABLE, not a secret (a chat_id isn't sensitive, and you
          # want to see/flip this one). Unset = serve every active user.
          PIPELINE_USER_ALLOWLIST: ${{ vars.PIPELINE_USER_ALLOWLIST }}
        run: node src/pipeline/index.js
