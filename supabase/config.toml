# Minimal Supabase CLI config. Generated by hand rather than `supabase init` so
# it doesn't overwrite schema.sql; run `npx supabase link --project-ref <ref>`
# to attach it to the hosted project.
project_id = "briefcast"

[functions.telegram-bot]
# Telegram sends its own secret-token header, not a Supabase JWT, so JWT
# verification must be off or every webhook POST is rejected with 401.
# The function checks x-telegram-bot-api-secret-token itself instead.
verify_jwt = false
